name: Build & Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AEZAKMI Pro
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $ver = $conf.version
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          echo "Version: $ver"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare bundled resources (Node.js + Playwright)
        run: node scripts/prepare-bundle.cjs

      - name: Build web assets
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.APP_VERSION }}
          releaseName: 'AEZAKMI Pro v${{ env.APP_VERSION }}'
          releaseBody: |
            # AEZAKMI Pro v${{ env.APP_VERSION }}

            ## Что нового

            - 🟢 **Proxys.io** — покупка прокси прямо из приложения: каталог из 7 типов,
              83 страны, расчёт цены и продление заказов
            - 🔵 **PSB Proxy** — резидентные, мобильные и датацентр-прокси с оплатой
              по трафику: выбор гео вплоть до города и провайдера, ротация IP
            - ➖ Интеграция SX.ORG удалена
            - 🔧 Прокси из интеграций подставляются в профиль в один клик,
              повторный импорт больше не создаёт дубликаты
            - 🔒 Сетевой стек переведён на rustls — починены загрузки и запросы
              к API на системах с урезанным хранилищем сертификатов Windows

            ## Установка

            1. Скачайте **AEZAKMI_${{ env.APP_VERSION }}_x64-setup.exe**
            2. Запустите установщик
            3. Запустите программу — всё уже встроено!
            4. Активируйте лицензионный ключ

            ## Системные требования

            - Windows 10/11 (64-bit)
            - 4 GB RAM (рекомендуется 8 GB)
            - 500 MB свободного места
            - Интернет-соединение
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aezakmi-installer-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
